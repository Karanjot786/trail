name: Update geo database
# Monthly: fetch the new DB-IP Lite Country file and open a PR when it changed.
on:
  schedule:
    - cron: "17 6 3 * *" # 06:17 UTC on the 3rd; DB-IP publishes on the 1st
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - id: geo
        run: echo "build=$(./scripts/update-geo.sh | tail -n1)" >> "$GITHUB_OUTPUT"
      - run: go test ./internal/enrich/ ./scripts/...
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: geo/dbip-country-${{ steps.geo.outputs.build }}
          commit-message: "geo: DB-IP Lite Country ${{ steps.geo.outputs.build }}"
          title: "geo: DB-IP Lite Country ${{ steps.geo.outputs.build }}"
          body: |
            Monthly refresh of the embedded `internal/enrich/geodata/dbip-country-lite.mmdb` by `scripts/update-geo.sh`.
            The file passed `scripts/geocheck` (database type, build date, known answers) and the enrich tests.

            Data: DB-IP Lite Country, CC BY 4.0, https://db-ip.com
          add-paths: internal/enrich/geodata/dbip-country-lite.mmdb
          delete-branch: true
