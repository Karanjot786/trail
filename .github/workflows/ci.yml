name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race ./...

  tracker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tracker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tracker/package-lock.json }
      - run: npm ci
      - run: npm run size # builds; fails if any tracker file > 2048 bytes gzipped
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run
      - run: pnpm build

  trail-analytics:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/trail-analytics } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: packages/trail-analytics/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  site:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: site/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium firefox
      - run: pnpm test:landing
      - run: pnpm test:docs
      - run: pnpm budget
      - run: pnpm lh -- --ci # gates accessibility, SEO and best practices only
