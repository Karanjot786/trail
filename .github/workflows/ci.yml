name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *' # nightly: also runs the framework smoke

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.f.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            packages:
              - 'packages/**'

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...
      - run: go test -race ./...
      # Signature header parsers are fuzzed briefly on every run (plan T-3).
      - run: go test ./internal/agents -run '^$' -fuzz FuzzParseSignatureInput -fuzztime 10s
      - run: go test ./internal/agents -run '^$' -fuzz FuzzParseDictionary -fuzztime 10s

  go-perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test ./internal/query -run Perf -count=1 -v # no -race: it measures time

  tracker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: tracker } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: tracker/package-lock.json }
      - run: npm ci
      - run: npm run size # builds; fails if any tracker file > 2048 bytes gzipped
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run
      - run: pnpm build
      - run: node scripts/budget.mjs # initial JS <= 170 KB gzip, lazy chunks <= 60 KB, no table or chart lib in the entry

  web-e2e:
    needs: [go, web]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: E2E_ALL=1 pnpm exec playwright test
        env: { E2E_SKIP_BUILD: '1', TRAIL_AGENT_LISTS: 'off' }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: web/playwright-report, retention-days: 7 }

  demo-fixtures:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm fixtures:check # records twice: determinism, contract keys, size caps
        working-directory: web
      - run: pnpm fixtures # records the seeded demo into web/demo-data
        working-directory: web
      - run: pnpm build:demo # VITE_DATA=fixtures vite build, then the recording into dist-demo/demo-data (base /demo/)
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: E2E_ALL=1 pnpm exec playwright test -c playwright.fixtures.config.ts # no Go server is running
        working-directory: web
      - uses: actions/upload-artifact@v4
        with: { name: demo-dist, path: web/dist, retention-days: 14 }

  npm-package:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/trail-analytics } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: packages/trail-analytics/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build # src/exports.test.ts checks the built dist/
      - run: npm test
      # Size budgets: crawl <= 3 KB gzip, next/proxy <= 4 KB gzip (the core entry is guarded by its own test).
      - run: |
          crawl=$(gzip -9 -c dist/crawl/index.js | wc -c); proxy=$(gzip -9 -c dist/next/proxy/index.js | wc -c)
          echo "crawl=$crawl B, next/proxy=$proxy B"
          [ "$crawl" -le 3072 ] && [ "$proxy" -le 4096 ]

  npm-smoke:
    # Real Next and Astro apps against a mock Trail: on package changes and nightly.
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: packages/trail-analytics } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: packages/trail-analytics/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run smoke -- all

  site:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: site/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm build
      - run: npx playwright install --with-deps chromium firefox
      - run: pnpm test:landing
      - run: pnpm test:docs
      - run: pnpm budget
      - run: pnpm lh -- --ci # gates accessibility, SEO and best practices only
