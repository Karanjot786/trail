name: Docker image
# Publishes ghcr.io/karanjot786/trail for linux/amd64 and linux/arm64.
#   push to main  -> :edge
#   tag v1.2.3    -> :1.2.3, :1.2, :latest
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
          labels: |
            org.opencontainers.image.title=Trail
            org.opencontainers.image.description=Self-hosted web analytics in one binary
            org.opencontainers.image.licenses=MIT
      # The Dockerfile cross-compiles in its build stages, so arm64 needs no QEMU.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Smoke test the pushed amd64 image: no settings at all, it must come up healthy.
      - name: Smoke test
        run: |
          # Docker image names must be lowercase; the metadata step already lowercased the pushed tag, so reuse it.
          docker run -d --name smoke -p 8080:8080 "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          for i in $(seq 1 30); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          docker logs smoke 2>&1 | grep -q 'Log in with:'
          curl -fsS localhost:8080/healthz
